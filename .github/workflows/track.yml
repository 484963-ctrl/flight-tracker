name: מעקב מחירים
# ריצה אחת נמשכת כ-5.5 שעות ובודקת כל חצי שעה, ובסוף מפעילה את עצמה מחדש.
# (ההרצות המתוזמנות של GitHub לא אמינות — הן רק גיבוי, למקרה שהשרשרת נעצרה.)
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "לשלוח הודעת בדיקה לכל הערוצים"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency: { group: scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: התקנת הדפדפן
        run: |
          npx playwright install chromium
          timeout 300 npx playwright install-deps chromium || echo "install-deps נכשל, ממשיכים"
      - name: בדיקה כל חצי שעה
        env:
          FIRST_TEST: ${{ inputs.test_notify && '1' || '' }}
          RT_LOG: '1'
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TEXTMEBOT_APIKEY: ${{ secrets.TEXTMEBOT_APIKEY }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          end=$((SECONDS + 5*3600 + 20*60))
          first=1
          while :; do
            echo "=== בדיקה $(date -u +%H:%M) UTC"
            # הגרסה הכי חדשה של הקוד והנתונים — שינויים נכנסים לעבודה בלי להפעיל מחדש
            git pull -q --rebase -X ours origin main || echo "git pull נכשל, ממשיכים עם מה שיש"
            npm install --no-audit --no-fund --silent || true   # אם נוספה ספרייה חדשה
            sig() { node sig.js 2>/dev/null || echo x; }
            # מצב האתר לפני הבדיקה — שינוי שנעשה בזמן הבדיקה ייתפס מיד אחריה
            last=$(sig)
            TEST_NOTIFY=$([ -n "$first" ] && echo "$FIRST_TEST") node scan.js || echo "הבדיקה נכשלה, ממשיכים"
            first=
            git add data watches.json
            if ! git diff --cached --quiet; then
              git commit -q -m "עדכון מחירים"
              for i in 1 2 3; do git pull -q --rebase -X ours origin main && git push -q && break; sleep 5; done
            fi
            [ $SECONDS -ge $end ] && break
            # מחכים חצי שעה — אבל בודקים כל דקה אם הוסיפו/שינו טיול באתר (או ביקשו הודעת בדיקה), ואז בודקים מיד
            for i in $(seq 1 30); do
              sleep 60
              node tglink.js || true   # חיבור טלגרם של משתמשים חדשים
              now=$(sig)
              if [ "$now" != "x" ] && [ "$last" != "x" ] && [ "$now" != "$last" ]; then
                # שינוי באתר: בדיקה מהירה רק של הטיולים החדשים/ששונו, ואז ממשיכים לחכות לבדיקה המלאה
                echo "=== שינוי באתר — בדיקה מהירה $(date -u +%H:%M) UTC"
                last=$now
                git pull -q --rebase -X ours origin main || true
                ONLY_NEW=1 node scan.js || echo "הבדיקה המהירה נכשלה"
                git add data watches.json
                if ! git diff --cached --quiet; then
                  git commit -q -m "עדכון מחירים (טיול חדש)"
                  for j in 1 2 3; do git pull -q --rebase -X ours origin main && git push -q && break; sleep 5; done
                fi
                last=$(sig)
              fi
              [ "$last" = "x" ] && last=$now
            done
          done
      - name: הפעלה מחדש של השרשרת
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run track.yml --ref main
